<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HuntStay | Offline</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2efe4;
        color: #11120f;
        display: grid;
        min-height: 100vh;
        place-items: center;
      }
      .card {
        max-width: 520px;
        margin: 24px;
        padding: 24px;
        border-radius: 18px;
        border: 1px solid rgba(17, 18, 15, 0.15);
        background: #fff;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>You are offline</h1>
      <p>
        HuntStay can still show some saved data. Reconnect to use live map
        search, send messages, and complete payments.
      </p>
    </section>
  </body>
</html>
